name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4

  dependency:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Audit Python dependencies
        run: python -m pip install --upgrade pip pip-audit && pip-audit -r requirements.txt

  iac:
    name: Terraform security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: infrastructure/terraform
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12.3131.0
        with:
          directory: infrastructure/terraform
          framework: terraform
          quiet: true

  container:
    name: Container security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag secure-aws-devsecops:${{ github.sha }} .
      - name: Trivy image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasecurity/trivy:0.65.0 \
            image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
            secure-aws-devsecops:${{ github.sha }}
